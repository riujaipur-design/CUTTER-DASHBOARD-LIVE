    --ink:#1E2430; --ink-soft:#5B6472; --ink-faint:#8A93A1;
    --accent:#D6541F; --accent-ink:#7A2E0F;
    --steel:#2F6690; --steel-soft:#E5EEF3;

    --border:#DBE0E6; --border-soft:#E9ECEF;

  .rd-header-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; position:relative; z-index:1; }

  .rd-badge{ width:44px; height:44px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25); }

  .btn-accent{ background:var(--accent); color:#fff; }

  .btn-ghost{ background:rgba(255,255,255,0.08); color:#F1F3F5; border-color:rgba(255,255,255,0.18); }

  .btn-outline{ background:var(--surface); color:var(--ink); border-color:var(--border); }
  .btn-outline:hover{ background:var(--surface-2); }
  .btn-steel{ background:var(--steel); color:#fff; }
  .btn-steel:hover{ background:#254F70; }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  .rd-empty{ max-width:640px; margin:60px auto; text-align:center; padding:40px 28px; background:var(--surface); border:1.5px dashed var(--border); border-radius:14px; }
  .rd-empty h2{ font-family:'Oswald',sans-serif; font-size:20px; margin:14px 0 6px; }
  .rd-empty p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; line-height:1.6; }
  .rd-drop{ border:2px dashed var(--steel); border-radius:10px; padding:26px; background:var(--steel-soft); cursor:pointer; transition:.15s; }
  .rd-drop:hover{ background:#DCEAF1; }

  .rd-body{ padding:20px 24px 60px; max-width:1600px; margin:0 auto; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:18px; }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; position:relative; overflow:hidden; }
  .kpi-card .kpi-icon{ width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .kpi-card .kpi-val{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; line-height:1; }
  .kpi-card .kpi-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; margin-top:5px; font-weight:600; }

  .rd-tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border); align-items:center; justify-content:space-between; }
  .rd-tabs-left{ display:flex; gap:6px; }
  .rd-tab{ padding:10px 16px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; display:flex; align-items:center; gap:6px; }
  .rd-tab.active{ color:var(--accent-ink); border-bottom-color:var(--accent); }

  .rd-filters{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; }
  .rd-filters-head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
  .rd-filters-head h3{ font-family:'Oswald',sans-serif; font-size:14px; margin:0; display:flex; align-items:center; gap:7px; text-transform:uppercase; letter-spacing:0.03em; }
  .rd-filters-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-top:14px; }
  .rd-field label{ font-size:10.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; display:block; margin-bottom:4px; }
  .rd-field select, .rd-field input{ width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:var(--surface); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; }
  .rd-field select:focus, .rd-field input:focus{ outline:2px solid var(--steel); outline-offset:1px; }
  .rd-search{ position:relative; }
  .rd-search .material-icons{ position:absolute; left:8px; top:8px; color:var(--ink-faint); font-size:16px; }
  .rd-search input{ padding-left:30px; }
  .rd-toggle-row{ display:flex; align-items:center; gap:14px; margin-top:12px; flex-wrap:wrap; }
  .rd-switch{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .rd-switch input{ accent-color:var(--accent); width:15px; height:15px; }

  .rd-addfilter{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }

  .rd-addfilter .rd-field.narrow{ min-width:110px; flex:0 0 110px; }
  .filter-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip{ display:flex; align-items:center; gap:6px; background:var(--steel-soft); color:var(--steel); border-radius:20px; padding:5px 6px 5px 12px; font-size:12px; font-weight:600; }

  .rd-count{ font-size:13px; color:var(--ink-soft); }

  .rd-toolbar-right{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pagesize-select{ padding:7px 8px; border:1px solid var(--border); border-radius:6px; font-size:12.5px; font-family:'IBM Plex Sans',sans-serif; }

  .rd-table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; max-height:640px; }
  table.rd-table{ border-collapse:collapse; width:100%; font-size:12px; }

  table.rd-table tbody tr:hover{ background:var(--surface-2); }
  table.rd-table tbody tr.selected{ background:#FDEFE8; }
  th.sticky-col, td.sticky-col{ position:sticky; left:0; z-index:2; background:var(--surface); }
  tr.selected td.sticky-col{ background:#FDEFE8; }
  th.sticky-col{ background:#232A36; z-index:4; }
  th.sticky-col2, td.sticky-col2{ position:sticky; left:42px; z-index:2; background:var(--surface); box-shadow: 2px 0 4px rgba(0,0,0,0.06); }
  tr.selected td.sticky-col2{ background:#FDEFE8; }
  th.sticky-col2{ background:#232A36; z-index:4; }
  .status-pill{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:10.5px; font-weight:700; font-family:'IBM Plex Sans',sans-serif; text-transform:uppercase; letter-spacing:0.02em; }
  .st-pack{ background:var(--success-soft); color:var(--success); }
  .st-cutting{ background:var(--warning-soft); color:var(--warning); }
  .st-balance{ background:var(--steel-soft); color:var(--steel); }
  .st-none{ background:#F0F1F3; color:var(--ink-faint); }
  .st-other{ background:#F0F1F3; color:var(--ink-soft); }
  .rd-chk{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
  .aged-flag{ color:var(--danger); font-weight:700; }

  .rd-pagination{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; }
  .rd-page-btn{ padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--surface); font-size:12.5px; cursor:pointer; font-family:'IBM Plex Mono',monospace; }

  .fab-cart{ position:fixed; bottom:24px; right:24px; z-index:40; background:var(--accent); color:#fff; border:none; border-radius:50px; padding:14px 20px; display:flex; align-items:center; gap:10px; cursor:pointer; box-shadow:0 8px 24px rgba(214,84,31,0.4); font-weight:700; font-size:14px; transition:transform .15s ease; }

  .fab-badge{ background:#fff; color:var(--accent-ink); border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-family:'IBM Plex Mono',monospace; }

  .rd-overlay{ position:fixed; inset:0; background:rgba(20,24,30,0.5); z-index:50; }
  .rd-drawer{ position:fixed; top:0; right:0; bottom:0; width:420px; max-width:100vw; background:var(--surface); z-index:51; display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(0,0,0,0.25); animation:slideIn .22s ease; }

  .rd-drawer-head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:#232A36; color:#fff; }
  .rd-drawer-head h3{ font-family:'Oswald',sans-serif; margin:0; font-size:16px; text-transform:uppercase; letter-spacing:0.03em; display:flex; gap:8px; align-items:center; }
  .rd-drawer-body{ padding:16px 18px; overflow-y:auto; flex:1; }
  .cart-item{ border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .cart-item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .cart-item-name{ font-size:12.5px; font-weight:600; }
  .cart-item-sub{ font-size:11px; color:var(--ink-soft); margin-top:2px; font-family:'IBM Plex Mono',monospace; }
  .cart-qty-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .cart-qty-row input{ width:100px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .cart-qty-row span{ font-size:11.5px; color:var(--ink-faint); }
  .rd-form-field{ margin-bottom:12px; }
  .rd-form-field label{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; display:block; margin-bottom:4px; }
  .rd-form-field input, .rd-form-field textarea{ width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:'IBM Plex Sans',sans-serif; }
  .rd-drawer-foot{ padding:14px 18px; border-top:1px solid var(--border); background:var(--surface-2); }
  .rd-total-row{ display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:10px; }
  .rd-total-row b{ font-family:'IBM Plex Mono',monospace; color:var(--accent-ink); }
  .rd-empty-cart{ text-align:center; padding:40px 10px; color:var(--ink-faint); font-size:13px; }

  .booking-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .booking-card-head{ padding:12px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; background:var(--surface-2); }
  .booking-id{ font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--accent-ink); font-size:13px; }
  .booking-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .booking-items{ padding:0 16px 14px; }
  .booking-item-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px; }
  .booking-item-row:last-child{ border-bottom:none; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#232A36; color:#fff; padding:11px 20px; border-radius:8px; font-size:13px; z-index:60; display:flex; align-items:center; gap:8px; box-shadow:0 6px 20px rgba(0,0,0,0.25); max-width:90vw; text-align:center; }

  @media (max-width: 980px){
    .kpi-grid{ grid-template-columns:repeat(3,1fr); }
    .rd-filters-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width: 640px){
    .kpi-grid{ grid-template-columns:repeat(2,1fr); }
    .rd-filters-grid{ grid-template-columns:1fr; }
    .rd-body{ padding:14px; }
    .rd-drawer{ width:100vw; }
    .rd-header{ padding:16px; }
    .rd-title h1{ font-size:17px; }
  }
</style>
</head>
